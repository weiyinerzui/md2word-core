name: build-binaries

# 何时触发：
#   · 推 tag（v*）→ 自动构建三平台可执行文件并创建 Release
#   · 手动触发（Actions 页面 Run workflow）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            artifact: md2word-win-x64.exe
          - os: ubuntu-latest
            target: linux-x64
            artifact: md2word-linux-x64
          - os: macos-13        # Intel
            target: mac-x64
            artifact: md2word-mac-x64
          - os: macos-latest    # Apple Silicon
            target: mac-arm64
            artifact: md2word-mac-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 升级 npm（规避 runner 自带 npm 的 "Exit handler never called!" 崩溃）
        run: npm install -g npm@11

      - name: 安装依赖
        run: npm install --no-audit --no-fund --loglevel=error

      - name: 构建 web/dist
        run: npm run build:web

      - name: 打包可执行文件
        run: node pack/build.mjs --target ${{ matrix.target }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist-bin/${{ matrix.artifact }}
          if-no-files-found: error

      # 原生 runner 实跑冒烟（当前平台产物必然可执行）
      - name: 冒烟测试（Linux/macOS）
        if: runner.os != 'Windows'
        run: |
          chmod +x dist-bin/${{ matrix.artifact }}
          ./dist-bin/${{ matrix.artifact }} --help | head -3
      - name: 冒烟测试（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "dist-bin/${{ matrix.artifact }}" --help | Select-Object -First 3

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum md2word-* > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/md2word-*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## md2word 单文件版

            **普通用户**：下载对应平台文件，双击即用（无需安装 Node.js）。

            | 平台 | 文件 |
            |---|---|
            | Windows 64 位 | `md2word-win-x64.exe` |
            | Linux x64 | `md2word-linux-x64` |
            | macOS Intel | `md2word-mac-x64` |
            | macOS Apple Silicon | `md2word-mac-arm64` |

            **使用方式**
            - 双击（无参数）→ 启动本地 Web 应用，浏览器自动打开
            - 命令行：`md2word 输入.md -o 输出.docx [--style zh|en|default]`
            - 查看帮助：`md2word --help`

            > ⚠️ Windows 首次运行若被 SmartScreen 拦截：点「更多信息」→「仍要运行」。
            > 这是未代码签名应用的正常提示，非病毒。
            > macOS 若提示无法验证开发者：右键 → 打开，或 `xattr -dr com.apple.quarantine ./md2word-mac-*`
