name: build-binaries

# 何时触发：
#   · 推 tag（v*）→ 自动构建三平台可执行文件并创建 Release
#   · 手动触发（Actions 页面 Run workflow）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            artifact: md2word-win-x64.exe
          - os: ubuntu-latest
            target: linux-x64
            artifact: md2word-linux-x64
          - os: macos-14        # arm64 runner + Rosetta 跑 x64 冒烟（macos-13 Intel 队列过久）
            target: mac-x64
            artifact: md2word-mac-x64
          - os: macos-latest    # Apple Silicon
            target: mac-arm64
            artifact: md2word-mac-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 升级 npm（规避 runner 自带 npm 的 "Exit handler never called!" 崩溃）
        run: npm install -g npm@11

      - name: 安装依赖（含 postject —— v1.1.0 曾因依赖未装导致注入静默失败）
        run: npm install --no-audit --no-fund --loglevel=error

      - name: 构建 web/dist
        run: npm run build:web

      - name: 打包可执行文件
        run: node pack/build.mjs --target ${{ matrix.target }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist-bin/${{ matrix.artifact }}
          if-no-files-found: error

      # ===== 冒烟 1：CLI 模式（--help 必须输出 md2word 的帮助文本）=====
      # v1.1.0 的 Windows 产物实为未注入的原版 node.exe：--help 输出的是 node 自己的帮助，
      # 当时此步未校验内容（只 head -3），假阳性放行。现强制断言内容。
      - name: 冒烟测试 — CLI（Linux/macOS）
        if: runner.os != 'Windows'
        run: |
          chmod +x dist-bin/${{ matrix.artifact }}
          out=$(./dist-bin/${{ matrix.artifact }} --help 2>&1) || true
          echo "$out" | head -3
          echo "$out" | grep -q "md2word — AI Markdown" || { echo "✗ 冒烟失败：--help 未输出 md2word 帮助（产物疑似未注入/损坏）"; exit 1; }

      - name: 冒烟测试 — CLI（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = (& "dist-bin/${{ matrix.artifact }}" --help 2>&1) | Out-String
          $out.Substring(0, [Math]::Min(80, $out.Length))
          if ($out -notmatch "md2word — AI Markdown") { Write-Error "✗ 冒烟失败：--help 未输出 md2word 帮助（产物疑似未注入/损坏）"; exit 1 }

      # ===== 冒烟 2：Web 模式（复现用户主诉：双击应打开本地 Web 端）=====
      # 进程以无参启动 → 应在 127.0.0.1 起服务，/ 返回 md2word 页面，/app.js 返回打包 JS。
      - name: 冒烟测试 — Web（Linux/macOS）
        if: runner.os != 'Windows'
        run: |
          ./dist-bin/${{ matrix.artifact }} > web.log 2>&1 &
          APP=$!
          ok=""
          for i in $(seq 1 25); do
            for port in $(seq 5173 5192); do
              if curl -sf -o page.html "http://127.0.0.1:$port/"; then ok=$port; break 2; fi
            done
            sleep 1
          done
          if [ -z "$ok" ]; then echo "✗ Web 冒烟失败：本地服务未起来"; cat web.log; kill $APP 2>/dev/null; exit 1; fi
          echo "listening on :$ok"
          grep -q "md2word" page.html || { echo "✗ 首页内容异常"; cat page.html; kill $APP; exit 1; }
          curl -s -o app.js.bin -w "app.js -> %{http_code} %{size_download}B\n" "http://127.0.0.1:$ok/app.js"
          [ -s app.js.bin ] || { echo "✗ app.js 为空"; kill $APP; exit 1; }
          kill $APP 2>/dev/null || true

      - name: 冒烟测试 — Web（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist-bin/${{ matrix.artifact }}" -PassThru `
                -RedirectStandardOutput web.log -RedirectStandardError web.err -WindowStyle Hidden
          $ok = $false; $port = 0
          foreach ($i in 1..25) {
            foreach ($pt in 5173..5192) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$pt/" -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200 -and $r.Content -match 'md2word') { $ok = $true; $port = $pt; break }
              } catch {}
            }
            if ($ok) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $ok) { Get-Content web.log, web.err; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "✗ Web 冒烟失败：本地服务未起来" }
          Write-Host "listening on :$port"
          try {
            $app = Invoke-WebRequest -Uri "http://127.0.0.1:$port/app.js" -UseBasicParsing -TimeoutSec 60
            Write-Host ("app.js -> {0} {1}B" -f $app.StatusCode, $app.RawContentLength)
            if ($app.StatusCode -ne 200 -or $app.RawContentLength -lt 1000000) { throw "app.js 异常" }
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum md2word-* > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/md2word-*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## md2word 单文件版

            **普通用户**：下载对应平台文件，双击即用（无需安装 Node.js）。

            | 平台 | 文件 |
            |---|---|
            | Windows 64 位 | `md2word-win-x64.exe` |
            | Linux x64 | `md2word-linux-x64` |
            | macOS Intel | `md2word-mac-x64` |
            | macOS Apple Silicon | `md2word-mac-arm64` |

            **使用方式**
            - 双击（无参数）→ 启动本地 Web 应用，浏览器自动打开
            - 命令行：`md2word 输入.md -o 输出.docx [--style zh|en|default]`
            - 查看帮助：`md2word --help`

            > ⚠️ Windows 首次运行若被 SmartScreen 拦截：点「更多信息」→「仍要运行」。
            > 这是未代码签名应用的正常提示，非病毒。
            > macOS 若提示无法验证开发者：右键 → 打开，或 `xattr -dr com.apple.quarantine ./md2word-mac-*`
